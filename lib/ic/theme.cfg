# theme defaults
#
# SGR color format:
#   foreground truecolor: 38;2;R;G;B
#   background truecolor: 48;2;R;G;B
#   bold: 1
#   reset/default: 0
#
# Example:
#   1;38;2;0;0;0;48;2;170;225;255
# means:
#   bold black text on light-blue background.
#
# Important:
#   Do not use ';' for inline comments after values.
#   SGR color values use ';' as their own separator.
#   Use '#' comments on separate lines.

[theme]

# Frame style used by common windows/panels.
# 0 = ASCII, 1 = single-line frame, 2 = double-line frame.
frame_style=1

# Reserved for future panel shadow support.
# Currently unused.
panel_shadow=0

# Modal animation delay in UI ticks.
# 0 disables animation.
# 1 means: draw shadow first, then draw window on next tick.
# Higher values make the transition slower.
modal_anim_ticks=3

# Background and base text color for regular Copy modal.
# Used for modal body fill and fallback text.
# Default: dark text on light-gray background.
modal_copy_code=38;2;25;25;25;48;2;210;210;210

# Background and base text color for Overwrite modal.
# Used for modal body fill and fallback text.
# Default: dark-purple text on pink background.
modal_overwrite_code=38;2;40;15;35;48;2;255;185;225

# Modal frame and title color.
# Used for border glyphs and title on top border.
modal_frame_code=1;38;2;80;80;80;48;2;210;210;210

# Normal modal text color.
# Used for message text and static labels like "Copy to:".
modal_text_code=38;2;25;25;25;48;2;210;210;210

# Modal shadow color.
# Kept for future theme-controlled shadow rendering.
# Current modal code does not override framework default shadow with this value.
modal_shadow_code=38;2;80;80;80;48;2;80;80;80

# Editable field color when the field is not focused.
# Used for the "Copy to:" path field.
modal_field_code=38;2;20;20;20;48;2;245;245;245

# Focus color.
# Used for focused edit field and focused checkbox.
modal_focus_code=1;38;2;0;0;0;48;2;170;225;255

# Normal button color.
# Used for buttons when they are not focused.
modal_button_code=1;38;2;20;20;20;48;2;235;235;235

# Focused button color.
# Used for the currently focused button.
modal_button_focus_code=1;38;2;0;0;0;48;2;170;225;255